<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content Security Policy: the app may only talk to itself. Any call to an outside
      server (analytics, paid API, CDN) is blocked by the browser, so nothing can cost money
      or leak data. 'wasm-unsafe-eval' is needed later for on-device OCR (Tesseract.js).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="%BASE_URL%brand/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="%BASE_URL%brand/favicon-64.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%brand/apple-touch-icon.png" />
    <script src="%BASE_URL%theme-init.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#14532d" />
    <title>Personal Chef</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
